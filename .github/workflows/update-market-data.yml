name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 2"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Yahoo market data
        run: npm run fetch-yahoo-market-data
        continue-on-error: true

      - name: Import monthly market data
        run: npm run import-market-data

      - name: Validate public market data
        run: npm run validate-market-data

      - name: Build site
        run: npm run build

      - name: Commit valid market data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw-market-data/*.csv public/market-data/*.csv data/market-data-status.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update market data"
            git push
          fi
